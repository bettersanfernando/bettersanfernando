name: Bug report
description: Report a problem with the site's behavior, UI, or code
title: '[Bug] '
labels: []
body:
  - type: input
    id: page
    attributes:
      label: Affected page/route
      description: e.g. /services/health-services
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser/device (if relevant)
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
    validations:
      required: false
