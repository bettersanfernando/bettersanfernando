name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm civic:verify
      - run: pnpm next-shell:smoke
      - name: Verify crawl discovery in production HTML
        run: |
          pnpm start --hostname 127.0.0.1 --port 32626 > "$RUNNER_TEMP/crawl-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:32626/robots.txt > /dev/null; then
              break
            fi
            sleep 1
          done
          pnpm crawl-discovery:smoke
