name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm data:validate
      - run: pnpm check:public-data-boundary
      - run: pnpm test:public-data-boundary
      - run: pnpm search:smoke
      - run: pnpm nav:smoke
      - run: pnpm next-shell:smoke
      - run: pnpm build
